<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster | Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <h1 class="logo">StockMaster</h1>
    <p class="subtitle">Gestión inteligente de inventarios</p>

    <form onsubmit="iniciarSesion(event)">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
      </div>

      <button type="submit">Iniciar sesión</button>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
