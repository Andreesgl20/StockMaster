<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockMaster | Dashboard</title>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<h2>StockMaster</h2>

<a href="dashboard.html" class="active">Dashboard</a>

<a href="productos.html">Productos</a>

<a href="alertas.html">Alertas</a>

<a href="#" onclick="cerrarSesion()">Cerrar sesión</a>

</aside>

<main class="content">

<section class="header">

<h1>Dashboard Ejecutivo</h1>

<p>Resumen general del estado del inventario.</p>

</section>

<section class="cards">

<div class="card">
<h3>Productos</h3>
<p class="number">128</p>
</div>

<div class="card">
<h3>Sucursales</h3>
<p class="number">3</p>
</div>

<div class="card">
<h3>Alertas</h3>
<p class="number">7</p>
</div>

</section>

<section class="table-box">

<table>

<thead>

<tr>

<th>Sucursal</th>

<th>Inventario</th>

<th>Estado</th>

</tr>

</thead>

<tbody>

<tr>

<td>Norte</td>

<td>Estable</td>

<td><span class="badge ok">Disponible</span></td>

</tr>

<tr>

<td>Centro</td>

<td>En revisión</td>

<td><span class="badge warning">Revisar</span></td>

</tr>

<tr>

<td>Sur</td>

<td>Stock crítico</td>

<td><span class="badge danger">Crítico</span></td>

</tr>

</tbody>

</table>

</section>

</main>

</div>

<script src="js/app.js"></script>

</body>

</html>
